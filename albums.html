    <!-- Light & Dark Mode -->
    <script>
      /* =====================================================
     DAY / NIGHT MODE
  ===================================================== */

      const themeButton = document.getElementById("theme-btn");
      const themeIcon = document.getElementById("theme-icon");
      const themeLabel = document.getElementById("theme-label");

      const html = document.documentElement;

      /* =====================================================
     LOAD SAVED THEME
  ===================================================== */

      const savedTheme = localStorage.getItem("melovia-theme");

      if (savedTheme === "dark") {
        html.classList.add("darkmode");

        themeIcon.textContent = "🌙";
        themeLabel.textContent = "Day mode";
      } else {
        html.classList.remove("darkmode");

        themeIcon.textContent = "🌙";
        themeLabel.textContent = "Night mode";
      }

      /* =====================================================
     THEME BUTTON
  ===================================================== */

      themeButton.addEventListener("click", function () {
        const isDarkMode = html.classList.contains("darkmode");

        if (isDarkMode) {
          /* =========================
         CHANGE TO LIGHT MODE
      ========================= */

          html.classList.remove("darkmode");

          themeIcon.textContent = "🌙";
          themeLabel.textContent = "Night mode";

          localStorage.setItem("melovia-theme", "light");
        } else {
          /* =========================
         CHANGE TO DARK MODE
      ========================= */

          html.classList.add("darkmode");

          themeIcon.textContent = "☀️";
          themeLabel.textContent = "Day mode";

          localStorage.setItem("melovia-theme", "dark");
        }
      });
    </script>

      /* =========================================================

   ========================================================= */

      const grid = document.getElementById("albumGrid");

      const albumModalEl = document.getElementById("albumModal");
      const albumModal = new bootstrap.Modal(albumModalEl);

      const amCover = document.getElementById("amCover");
      const amTitle = document.getElementById("amTitle");
      const amMeta = document.getElementById("amMeta");
      const amSongList = document.getElementById("amSongList");

      const prevAlbumBtn = document.getElementById("prevAlbumBtn");
      const nextAlbumBtn = document.getElementById("nextAlbumBtn");

      let currentAlbum = 0;

      /* =========================================================
   ALBUM CARDS
   ========================================================= */

      function renderGrid() {
        grid.innerHTML = "";

        albums.forEach((album, index) => {
          const col = document.createElement("div");

          // Bootstrap 5 responsive columns
          col.className = "col-12 col-sm-6 col-lg-4 col-xl-3";

          col.innerHTML = `
      <article class="album-card" data-index="${index}">
        <div class="album-cover">
          <img src="${album.cover}" alt="${album.title}">
        </div>

        <div class="album-info">
          <h2 class="album-title">${album.title}</h2>
          <p class="artist-name">${album.artist}</p>
          <p class="album-details">${album.year}</p>
        </div>
      </article>
    `;

          col.querySelector(".album-card").addEventListener("click", () => {
            openAlbum(index);
          });

          grid.appendChild(col);
        });
      }

      renderGrid();

      /* =========================================================
   ALBUM MODAL
   ========================================================= */

      function openAlbum(index) {
        currentAlbum = index;

        const album = albums[index];

        amCover.src = album.cover;
        amCover.alt = album.title;
        amTitle.textContent = album.title;
        amMeta.textContent = `${album.artist} • ${album.year}`;

        renderSongs();

        albumModal.show();
      }

      function renderSongs() {
        const album = albums[currentAlbum];

        amSongList.innerHTML = "";

        album.songs.forEach((song, index) => {
          const row = document.createElement("div");

          row.className = "song-audio-row";

          row.innerHTML = `
      <div class="song-audio-head">
        <div class="song-num">${String(index + 1).padStart(2, "0")}</div>
        <div class="song-name">${song.name}</div>
      </div>

      <audio controls preload="metadata" src="${song.src}"></audio>
    `;

          amSongList.appendChild(row);
        });
      }

      /* Previous album */
      prevAlbumBtn.addEventListener("click", () => {
        currentAlbum = (currentAlbum - 1 + albums.length) % albums.length;
        openAlbum(currentAlbum);
      });

      /* Next album */
      nextAlbumBtn.addEventListener("click", () => {
        currentAlbum = (currentAlbum + 1) % albums.length;
        openAlbum(currentAlbum);
      });
    </script>
