<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Melovia — Events</title>
     <!-- Bootstrap css -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

     <!-- Bootstap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>

    <!-- Bootstap Icon -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- CSS link -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="layout.css">

      <!-- Google Fonts (same as the rest of the site) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
</head>
<body>
    <!-- =========================
       MOBILE MENU
  ========================== -->
    <input type="checkbox" id="nav-toggle" />
    <label for="nav-toggle" class="nav-label"> ☰ </label>
 
    <!-- =========================
       SIDEBAR
  ========================== -->
    <aside class="sidebar">
      <!-- Brand -->
      <div class="brand">MELOVIA<span>.</span></div>
 
      <!-- Navigation -->
      <nav class="nav-links">
        <a href="index.html"> Home </a>
        <a href="discover.html"> Discover </a>
        <a href="artists.html"> Artists </a>
        <a href="albums.html"> Albums </a>
        <a href="genres.html"> Genres </a>
        <a href="events.html" class="active"> Events </a>
        <a href="contact.html"> Contact </a>
      </nav>

      <!-- Sign Up + Day/Night toggle -->
      <div class="side-foot">
        <!-- id="theme-btn" is what the script below listens for -->
        <button type="button" id="theme-btn" class="theme-btn">
          <span id="theme-icon">☀️</span>
          <span id="theme-label">Day mode</span>
        </button>
        <label for="modal-toggle" class="signup-btn"> Sign Up </label>
      </div>
    </aside>

     <!-- =========================
       MAIN CONTENT — Events page
  ========================== -->
    <main class="main">
      <header class="main-header">
        <div>
          <p class="eyebrow">Live shows</p>
          <h1>Events</h1>
        </div>
      </header>
 
      <!-- Featured countdown: the next upcoming concert.
           data-date is read by the JS at the bottom to build the countdown. -->
      <section class="hero-event" data-date="2026-11-02T21:00:00">
        <p class="hero-tag">Next up</p>
        <h2>Neon Nights Tour</h2>
        <p class="hero-meta">Berlin · Astra Kulturhaus · 9:00 PM</p>
 
        <div class="countdown">
          <div class="countdown-block">
            <span class="c-days">00</span>
            <small>Days</small>
          </div>
          <div class="countdown-block">
            <span class="c-hours">00</span>
            <small>Hours</small>
          </div>
          <div class="countdown-block">
            <span class="c-minutes">00</span>
            <small>Minutes</small>
          </div>
          <div class="countdown-block">
            <span class="c-seconds">00</span>
            <small>Seconds</small>
          </div>
        </div>
 
        <button class="btn-tickets">Get tickets</button>
      </section>

      
</body>
</html>
