<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>MELOVIA</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap 5 CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Your CSS -->
    <link rel="stylesheet" href="artists_albums.css" />
</head>
<body>
    <input type="checkbox" id="nav-toggle" />

    <label for="nav-toggle" class="nav-label"> ☰ </label>

    <!-- =========================
       SIDEBAR
  ========================== -->

    <aside class="sidebar">
      <!-- Brand -->

      <div class="brand">MELOVIA<span>.</span></div>

      <!-- Navigation -->

      <nav class="nav-links">
        <a href="index.html"> Home </a>

        <a href="discover.html"> Discover </a>

        <a href="artists.html" class="active"> Artists </a>

        <a href="albums.html"> Albums </a>

        <a href="genres.html"> Genres </a>

        <a href="events.html"> Events </a>

        <a href="contact.html"> Contact </a>
      </nav>

      <!-- Sign Up -->

      <div class="side-foot">
        <label for="modal-toggle" class="signup-btn"> Sign Up </label>
      </div>
      <button type="button" class="theme-btn" id="theme-btn">
        <span id="theme-icon"> ☀️ </span>

        <span id="theme-label"> Day mode </span>
      </button>
    </aside>
    <main class="page-wrap">
      <section class="page-head-row">
        <div>
          <h1 class="page-title">Meet the Artists</h1>
          <p class="page-subtitle">Choose a genre and discover the artists.</p>
        </div>
        <a href="albums.html" class="page-link">Albums →</a>
      </section>

      <!-- Genre filters -->
      <section class="filters" id="filters">
        <button class="pill active" data-genre="all">All</button>
        <button class="pill" data-genre="pop">Pop</button>
        <button class="pill" data-genre="rock">Rock</button>
        <button class="pill" data-genre="rnb">R&amp;B / Soul</button>
        <button class="pill" data-genre="hiphop">Hip-Hop</button>
        <button class="pill" data-genre="electronic">Electronic</button>
        <button class="pill" data-genre="jpop">J-Pop</button>
        <button class="pill" data-genre="kpop">K-Pop</button>
        <button class="pill" data-genre="metal">Metal</button>
      </section>

      <!-- Bootstrap grid -->
      <section class="container-fluid artists-container">
        <div class="row g-4" id="artistGrid"></div>
      </section>
    </main>

    <!-- Artist modal: opens on card click, holds the song list -->
    <div
      class="modal fade"
      id="artistModal"
      tabindex="-1"
      aria-labelledby="dName"
      aria-hidden="true"
    >
      <div
        class="modal-dialog modal-dialog-centered modal-lg artist-modal-dialog"
      >
        <div class="modal-content">
          <div class="modal-header">
            <div class="d-head">
              <div class="d-photo">
                <img id="dImage" src="" alt="" />
              </div>

              <div class="artist-heading">
                <div class="d-name" id="dName">—</div>
                <span class="badge genre-badge" id="dGenre">—</span>
              </div>
            </div>

            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
              aria-label="Close"
            ></button>
          </div>

          <div class="modal-body">
            <h2 class="songs-title">Album</h2>
            <a href="albums.html" class="album-link-card">
              <div class="album-link-cover">
                <img id="dAlbumImage" src="" alt="" />
              </div>
              <div class="album-link-info">
                <div class="album-link-title" id="dAlbumTitle">—</div>
                <div class="album-link-year" id="dAlbumYear">—</div>
              </div>
              <span class="album-link-arrow">→</span>
            </a>
          </div>

          <div class="modal-footer">
            <button class="btn btn-outline-light" id="prevArtistBtn">
              ◀ Previous
            </button>
            <button class="btn btn-outline-light" id="nextArtistBtn">
              Next ▶
            </button>
          </div>
        </div>
      </div>
    </div>
    <!-- ========footer======= -->
    <footer class="melovia-footer">
      <div class="brand2">MELOVIA<span>.</span></div>

      <div class="sf-bottom">
        <div>© 2026 MELOVIA. All rights reserved.</div>
        <div class="sf-legal">
          <a href="#">Privacy Policy</a>
          <a href="#">Terms of Service</a>
          <a href="#">Cookies</a>
        </div>
      </div>
    </footer>


    <!-- =========================
       SIGN UP MODAL
  ========================== -->

    <input type="checkbox" id="modal-toggle" />

    <div class="modal-overlay">
      <div class="modal-box">
        <!-- Modal Header -->

        <div class="modal-head">
          <h2>Create Account</h2>

          <label for="modal-toggle" class="modal-close"> ✕ </label>
        </div>

        <!-- Email -->

        <div class="m-field">
          <label> Email </label>

          <input type="email" placeholder="you@email.com" />
        </div>

        <!-- Username -->

        <div class="m-field">
          <label> Username </label>

          <input type="text" placeholder="Choose a username" />
        </div>

        <!-- Password -->

        <div class="m-field">
          <label> Password </label>

          <input type="password" placeholder="••••••••" />
        </div>

        <!-- Submit -->

        <a href="index.html" class="m-submit"> Submit </a>

        <!-- Note -->

        <div class="m-note">By signing up you agree to our terms.</div>
      </div>
    </div>
</body>
</html>
